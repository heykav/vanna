[project]
name = "vanna"
version = "0.1.0"
description = "A model-driven options pricing, Greeks, and backtesting library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "matplotlib>=3.8"]
dev = ["pytest>=7.4"]

[project.scripts]
vanna = "vanna.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vanna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
